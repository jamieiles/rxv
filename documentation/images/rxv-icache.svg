<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
<marker id="s-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
<marker id="a-bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<marker id="s-bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<marker id="a-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="s-commit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="a-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<marker id="s-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
<marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<marker id="s-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<marker id="a-ex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
<marker id="s-ex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
</defs>
<rect width="1500" height="1100" fill="#ffffff"/>
<text x="40.0" y="52.0" font-size="27" text-anchor="start" fill="#0f172a" font-weight="700">RXV Instruction Cache — RXVICache</text>
<text x="40.0" y="78.0" font-size="14" text-anchor="start" fill="#475569" font-weight="400">Virtually indexed, physically tagged · 4 ways × 16 sets × 32 B line (parameterised; 2 KB by default) · blocking refill</text>
<text x="1460.0" y="52.0" font-size="12" text-anchor="end" fill="#94a3b8" font-weight="400">rtl/RXVICache.sv</text>
<text x="60.0" y="112.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="700">INPUTS</text>
<rect x="60.0" y="124.0" width="290.0" height="76.0" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="160.5" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">address [31:2] · valid</text>
<text x="205.0" y="177.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">virtual address from Fetch 1</text>
<rect x="400.0" y="124.0" width="300.0" height="76.0" rx="10" fill="#e1f5fa" stroke="#0891b2" stroke-width="1.6"/>
<text x="550.0" y="160.5" font-size="13" text-anchor="middle" fill="#0e7490" font-weight="600">phys_in [31:2] · phys_valid</text>
<text x="550.0" y="177.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">physical address from the ITLB</text>
<rect x="750.0" y="124.0" width="300.0" height="76.0" rx="10" fill="#fdeaea" stroke="#dc2626" stroke-width="1.6"/>
<text x="900.0" y="160.5" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="600">invalidate</text>
<text x="900.0" y="177.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">FENCE.I, driven by the LSU</text>
<text x="60.0" y="228.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="700">CYCLE 1 — RAM read, indexed with the virtual address</text>
<rect x="60.0" y="240.0" width="290.0" height="110.0" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="279.5" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">Address decode</text>
<text x="205.0" y="296.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">index  = A[8:5]   16 sets</text>
<text x="205.0" y="310.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">offset = A[4:2]   8 words</text>
<text x="205.0" y="324.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">tag    = A[31:9]  23 bits</text>
<rect x="400.0" y="240.0" width="300.0" height="110.0" rx="10" fill="#e1f5fa" stroke="#0891b2" stroke-width="1.6"/>
<text x="550.0" y="279.5" font-size="13" text-anchor="middle" fill="#0e7490" font-weight="600">TagRam (CacheRAM)</text>
<text x="550.0" y="296.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">16 sets × 4 lanes</text>
<text x="550.0" y="310.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">{valid, tag[22:0]}</text>
<text x="550.0" y="324.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">read-during-write bypass</text>
<rect x="750.0" y="240.0" width="300.0" height="110.0" rx="10" fill="#e1f5fa" stroke="#0891b2" stroke-width="1.6"/>
<text x="900.0" y="286.5" font-size="13" text-anchor="middle" fill="#0e7490" font-weight="600">DataRam (CacheRAM)</text>
<text x="900.0" y="303.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">128 words × 4 lanes</text>
<text x="900.0" y="317.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">one 32-bit word per way</text>
<rect x="1100.0" y="240.0" width="340.0" height="110.0" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
<text x="1270.0" y="286.5" font-size="13" text-anchor="middle" fill="#475569" font-weight="600">BitPLRU</text>
<text x="1270.0" y="303.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">bit pseudo-LRU, one state per set</text>
<text x="1270.0" y="317.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">selects the victim way on a miss</text>
<polyline points="205.0,200.0 205.0,240.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<polyline points="350.0,270.0 400.0,270.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<polyline points="205.0,350.0 205.0,384.0 900.0,384.0 900.0,350.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<rect x="473.0" y="367.0" width="94.0" height="15.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6" opacity="0.72"/>
<text x="520.0" y="378.0" font-size="11" text-anchor="middle" fill="#334155" font-weight="600">index + offset</text>
<polyline points="1240.0,384.0 1240.0,350.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<polyline points="900,384 1240,384" fill="none" stroke="#334155" stroke-width="1.6"/>
<text x="60.0" y="412.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="700">CYCLE 2 — tag compare against the physical address</text>
<rect x="60.0" y="424.0" width="290.0" height="120.0" rx="10" fill="#fdeaea" stroke="#dc2626" stroke-width="1.6"/>
<text x="205.0" y="468.5" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="600">busy</text>
<text x="205.0" y="485.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">miss | filling | invalidating</text>
<text x="205.0" y="499.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">the fetch stage holds the address</text>
<text x="205.0" y="513.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">and replays it when busy drops</text>
<rect x="400.0" y="424.0" width="300.0" height="120.0" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="1.6"/>
<text x="550.0" y="475.5" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">Tag compare × 4 ways</text>
<text x="550.0" y="492.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">way_tag == A[31:9]</text>
<text x="550.0" y="506.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">&amp;&amp; way_valid &amp;&amp; phys_valid</text>
<rect x="750.0" y="424.0" width="300.0" height="120.0" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="1.6"/>
<text x="900.0" y="468.5" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">Hit / miss</text>
<text x="900.0" y="485.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">way_hit[3:0] → OneHotDecode</text>
<text x="900.0" y="499.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">hit_way</text>
<text x="900.0" y="513.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">miss = valid &amp; ~|way_hit</text>
<rect x="1100.0" y="424.0" width="340.0" height="120.0" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1270.0" y="475.5" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">Way select mux</text>
<text x="1270.0" y="492.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">dout = way_dout[hit_way]</text>
<text x="1270.0" y="506.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">zero when the lookup missed</text>
<rect x="1100.0" y="580.0" width="340.0" height="66.0" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="1.6"/>
<text x="1270.0" y="611.5" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">dout → Fetch 3</text>
<text x="1270.0" y="628.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">instruction written into the prefetch FIFO</text>
<polyline points="650.0,200.0 650.0,222.0 725.0,222.0 725.0,406.0 650.0,406.0 650.0,424.0" fill="none" stroke="#0891b2" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-mem)"/>
<g transform="rotate(-90 725 310)"><rect x="699.8" y="301.0" width="50.4" height="15" rx="4" fill="#ffffff" opacity="0.72"/><text x="725" y="313" font-size="11" text-anchor="middle" fill="#0e7490" font-weight="600" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">PA tag</text></g>
<polyline points="550.0,350.0 550.0,424.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<rect x="551.0" y="401.0" width="82.0" height="15.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6" opacity="0.72"/>
<text x="556.0" y="412.0" font-size="11" text-anchor="start" fill="#334155" font-weight="600">{valid, tag}</text>
<polyline points="700.0,484.0 750.0,484.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<polyline points="1050.0,484.0 1100.0,484.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<g transform="rotate(-90 1075 484)"><rect x="1046.6" y="475.0" width="56.8" height="15" rx="4" fill="#ffffff" opacity="0.72"/><text x="1075" y="487" font-size="11" text-anchor="middle" fill="#334155" font-weight="600" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">hit_way</text></g>
<polyline points="1000.0,350.0 1000.0,402.0 1160.0,402.0 1160.0,424.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<rect x="1027.0" y="385.0" width="106.0" height="15.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6" opacity="0.72"/>
<text x="1080.0" y="396.0" font-size="11" text-anchor="middle" fill="#334155" font-weight="600">4 × 32-bit words</text>
<polyline points="1270.0,544.0 1270.0,580.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-flow)"/>
<text x="60.0" y="688.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="700">MISS — blocking line fill (no hit under miss)</text>
<rect x="60.0" y="700.0" width="300.0" height="150.0" rx="10" fill="#fdf2e0" stroke="#d97706" stroke-width="1.6"/>
<text x="210.0" y="752.5" font-size="13" text-anchor="middle" fill="#b45309" font-weight="600">Fill control</text>
<text x="210.0" y="769.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">need_fill = miss &amp; !filling</text>
<text x="210.0" y="783.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">&amp; !invalidating</text>
<text x="210.0" y="797.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">filling holds until the last beat</text>
<text x="210.0" y="811.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">the fetch request is dropped</text>
<rect x="400.0" y="700.0" width="320.0" height="150.0" rx="10" fill="#e1f5fa" stroke="#0891b2" stroke-width="1.6"/>
<text x="560.0" y="759.5" font-size="13" text-anchor="middle" fill="#0e7490" font-weight="600">BusAdapter</text>
<text x="560.0" y="776.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">one burst read per line</text>
<text x="560.0" y="790.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">8 × 32-bit beats</text>
<text x="560.0" y="804.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">address = {tag, index, 0}</text>
<rect x="1040.0" y="700.0" width="400.0" height="150.0" rx="10" fill="#e7f7ec" stroke="#16a34a" stroke-width="1.6"/>
<text x="1240.0" y="752.5" font-size="13" text-anchor="middle" fill="#15803d" font-weight="600">Fill writes</text>
<text x="1240.0" y="769.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">each beat  → DataRam[victim way][beat]</text>
<text x="1240.0" y="783.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">last beat  → TagRam {1, tag}</text>
<text x="1240.0" y="797.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">PLRU updated to the filled way</text>
<text x="1240.0" y="811.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">victim way = PLRU output</text>
<rect x="770.0" y="736.0" width="210.0" height="78.0" rx="16" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
<text x="875.0" y="773.5" font-size="13" text-anchor="middle" fill="#475569" font-weight="600">AXI</text>
<text x="875.0" y="790.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">instruction port</text>
<polyline points="900.0,544.0 900.0,620.0 250.0,620.0 250.0,700.0" fill="none" stroke="#dc2626" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-red)"/>
<rect x="543.0" y="603.0" width="34.0" height="15.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6" opacity="0.72"/>
<text x="560.0" y="614.0" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">miss</text>
<polyline points="205.0,700.0 205.0,544.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-red)"/>
<polyline points="360.0,775.0 400.0,775.0" fill="none" stroke="#0891b2" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-mem)"/>
<polyline points="720.0,775.0 770.0,775.0" fill="none" stroke="#0891b2" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-mem)" marker-start="url(#s-mem)"/>
<polyline points="980.0,775.0 1040.0,775.0" fill="none" stroke="#0891b2" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-mem)"/>
<rect x="990.0" y="756.0" width="40.0" height="15.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6" opacity="0.72"/>
<text x="1010.0" y="767.0" font-size="11" text-anchor="middle" fill="#0891b2" font-weight="600">beats</text>
<polyline points="1240.0,700.0 1240.0,664.0 1070.0,664.0 1070.0,300.0 1050.0,300.0" fill="none" stroke="#16a34a" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-commit)"/>
<rect x="1038.0" y="549.0" width="64.0" height="15.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6" opacity="0.72"/>
<text x="1070.0" y="560.0" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">fill data</text>
<polyline points="1160.0,700.0 1160.0,676.0 368.0,676.0 368.0,320.0 400.0,320.0" fill="none" stroke="#16a34a" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-commit)"/>
<rect x="644.0" y="659.0" width="112.0" height="15.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6" opacity="0.72"/>
<text x="700.0" y="670.0" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">tag + valid write</text>
<text x="60.0" y="888.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="700">CACHE MAINTENANCE</text>
<rect x="60.0" y="900.0" width="400.0" height="130.0" rx="10" fill="#fdeaea" stroke="#dc2626" stroke-width="1.6"/>
<text x="260.0" y="942.5" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="600">Invalidate sweep (FENCE.I)</text>
<text x="260.0" y="959.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">one index per cycle, clears valid in every way</text>
<text x="260.0" y="973.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">busy is held for the whole sweep</text>
<text x="260.0" y="987.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">the LSU raises a global stall and resteers</text>
<text x="260.0" y="1001.5" font-size="11" text-anchor="middle" fill="#475569" font-weight="400">the pipeline once the sweep completes</text>
<polyline points="60.0,962.0 44.0,962.0 44.0,580.0 386.0,580.0 386.0,295.0 400.0,295.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-red)"/>
<rect x="500.0" y="900.0" width="940.0" height="150.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="524.0" y="928.0" font-size="12" text-anchor="start" fill="#0f172a" font-weight="700">Notes</text>
<text x="524.0" y="954.0" font-size="11" text-anchor="start" fill="#475569" font-weight="400">The RAM read starts from the virtual address while the ITLB translates in parallel; index + offset live inside the 4 KB page offset,</text>
<text x="524.0" y="976.0" font-size="11" text-anchor="start" fill="#475569" font-weight="400">so only the tag depends on the translation.  Tags carry no ASID: FENCE.VMA does not need to touch the instruction cache.</text>
<text x="524.0" y="998.0" font-size="11" text-anchor="start" fill="#475569" font-weight="400">A miss blocks the whole cache — there is no hit-under-miss and no prefetch beyond the line currently being filled.</text>
<text x="524.0" y="1020.0" font-size="11" text-anchor="start" fill="#475569" font-weight="400">PMU: pmu_icache_access is asserted for every tag compare, pmu_icache_miss for every line fill that is started.</text>
</svg>
